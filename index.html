<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
  :root {
    --bg: #f5f6f8; --card-bg: #ffffff; --text: #1a1a2e; --text-secondary: #6b7280;
    --border: #e5e7eb; --blue: #3b82f6; --blue-light: #eff6ff; --green: #10b981;
    --green-light: #ecfdf5; --amber: #f59e0b; --amber-light: #fffbeb; --red: #ef4444;
    --red-light: #fef2f2; --gray-light: #f9fafb;
    --shadow: 0 1px 2px rgba(0,0,0,0.04); --radius: 8px; --radius-sm: 5px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; padding: 12px 16px;
    font-size: 14px; -webkit-text-size-adjust: 100%;
  }
  .container { max-width: 1440px; margin: 0 auto; }

  .header-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px;
    flex-wrap: wrap; gap: 8px; position: relative;
  }
  .header-bar .hb-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .header-bar .hb-left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .header-bar .hb-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
  .header-bar .hb-meta { font-size: 12px; color: var(--text-secondary); }
  .header-bar .hb-date { font-size: 13px; font-weight: 600; padding: 2px 8px; background: var(--blue-light); color: var(--blue); border-radius: 10px; white-space: nowrap; }
  .header-bar .hb-actions { display: flex; gap: 6px; }
  .header-bar .hb-qr { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .header-bar .hb-qr img { width: 52px; height: 52px; border-radius: 4px; border: 1px solid var(--border); }
  .header-bar .hb-qr .qr-label { font-size: 11px; color: var(--text-secondary); line-height: 1.3; max-width: 60px; }
  .btn { padding: 4px 12px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-weight: 500; color: var(--text); white-space: nowrap; }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-primary:hover { background: #2563eb; color: #fff; }

  .pipeline-strip {
    display: flex; align-items: stretch; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden;
  }
  .pipeline-strip .ps-stage {
    flex: 1; padding: 8px 6px; text-align: center; position: relative;
    border-right: 1px solid var(--border); transition: background 0.2s; min-width: 0;
  }
  .pipeline-strip .ps-stage:last-child { border-right: none; }
  .pipeline-strip .ps-stage.done { background: var(--green-light); }
  .pipeline-strip .ps-stage.active { background: var(--blue-light); }
  .pipeline-strip .ps-stage.risk { background: var(--amber-light); }
  .pipeline-strip .ps-stage.stage4 { background: #f5f3ff; }
  .pipeline-strip .ps-stage.stage5 { background: #fff7ed; }
  .pipeline-strip .ps-stage.stage4 { background: #f5f3ff; }
  .pipeline-strip .ps-stage.stage5 { background: #fff7ed; }
  .ps-stage .ps-num { display: inline-block; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; line-height: 18px; margin-bottom: 3px; background: #e5e7eb; color: var(--text-secondary); }
  .ps-stage.done .ps-num { background: var(--green); color: #fff; }
  .ps-stage.active .ps-num { background: var(--blue); color: #fff; }
  .ps-stage.risk .ps-num { background: var(--amber); color: #fff; }
  .ps-stage .ps-name { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ps-stage .ps-stat { font-size: 15px; font-weight: 700; }
  .ps-stage.done .ps-stat { color: var(--green); }
  .ps-stage.active .ps-stat { color: var(--blue); }
  .ps-stage.risk .ps-stat { color: var(--amber); }
  .ps-stage.pending .ps-stat { color: var(--text-secondary); }
  .ps-stage .ps-bar { margin-top: 3px; height: 3px; background: #e5e7eb; border-radius: 2px; overflow: hidden; }
  .ps-stage .ps-bar-fill { height: 100%; border-radius: 2px; }

  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .summary-card { background: var(--card-bg); border-radius: var(--radius); padding: 8px 12px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .summary-card .sc-icon { font-size: 20px; flex-shrink: 0; }
  .summary-card .sc-body { min-width: 0; }
  .summary-card .sc-value { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .summary-card .sc-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: stretch; }
  .right-col { display: flex; flex-direction: column; gap: 10px; }
  .right-col .section-box { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .right-col #alertBox { flex: 2; }
  .right-col #notesBox { flex: 1; }
  .right-col .section-box .sb-hd { flex-shrink: 0; }
  #alertContent { flex: 1; overflow-y: auto; }
  .section-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .section-box .sb-hd { padding: 6px 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border); background: var(--gray-light); display: flex; align-items: center; gap: 5px; }
  .section-box .sb-hd .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }

  #notesArea { width: 100%; min-height: 0; flex: 1; border: none; padding: 10px 12px; font-size: 13px; font-family: inherit; resize: none; outline: none; color: var(--text); background: var(--card-bg); line-height: 1.6; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  #notesArea::placeholder { color: #c0c4cc; }
  #notesArea:focus { background: #fafbfc; }

  .city-table { width: 100%; font-size: 13px; table-layout: fixed; }
  .city-table th { padding: 5px 5px; text-align: center; font-weight: 600; font-size: 10px; color: var(--text-secondary); background: var(--gray-light); border-bottom: 1px solid var(--border); }
  .city-table td { padding: 5px 5px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .city-table tbody tr:hover { background: #f8fafc; }
  .city-table .ct-name { text-align: center; font-weight: 600; }
  .city-table th:nth-child(1), .city-table td:nth-child(1) { width: 14%; }
  .city-table th:nth-child(2), .city-table td:nth-child(2) { width: 11%; }
  .city-table th:nth-child(3), .city-table td:nth-child(3) { width: 16%; }
  .city-table th:nth-child(4), .city-table td:nth-child(4) { width: 13%; }
  .city-table th:nth-child(5), .city-table td:nth-child(5) { width: 30%; }
  .city-table th:nth-child(6), .city-table td:nth-child(6) { width: 16%; }
  .ct-mini-bar { display: flex; gap: 1px; height: 5px; border-radius: 3px; overflow: hidden; min-width: 60px; }
  .ct-mini-bar .ct-seg { height: 100%; }

  .alert-item { padding: 8px 12px; border-bottom: 1px solid var(--border); border-left: 3px solid var(--amber); font-size: 12px; }
  .alert-item:last-child { border-bottom: none; }
  .alert-item.critical { border-left-color: var(--red); }
  .alert-item.info { border-left-color: var(--blue); }
  .alert-item .ai-title { font-weight: 600; margin-bottom: 1px; }
  .alert-item .ai-detail { color: var(--text-secondary); }

  .table-wrap { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .table-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 6px; background: var(--gray-light); }
  .table-toolbar .filter-group { display: flex; gap: 5px; flex-wrap: wrap; }
  .table-toolbar select, .table-toolbar input { padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; background: #fff; max-width: 120px; }
  .table-scroll { overflow-x: auto; max-height: 380px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table thead { position: sticky; top: 0; z-index: 1; }
  table th { background: #f1f5f9; padding: 6px 8px; text-align: left; font-weight: 600; font-size: 10px; color: var(--text-secondary); border-bottom: 2px solid var(--border); white-space: nowrap; }
  table td { padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table tbody tr:hover { background: #f8fafc; }
  .badge { display: inline-block; padding: 1px 5px; border-radius: 8px; font-size: 10px; font-weight: 500; }
  .badge-green { background: var(--green-light); color: #065f46; }
  .badge-amber { background: var(--amber-light); color: #92400e; }
  .badge-red { background: var(--red-light); color: #991b1b; }
  .badge-blue { background: var(--blue-light); color: #1e40af; }
  .badge-gray { background: #f3f4f6; color: #6b7280; }
  .count-info { font-size: 11px; color: var(--text-secondary); }
  .section-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .section-title .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
  .footer-dash { text-align: center; font-size: 10px; color: var(--text-secondary); padding: 8px 0; margin-top: 4px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 10px; padding: 20px; max-width: 680px; width: 92%; max-height: 85vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,0.12); }
  .modal-box h3 { font-size: 15px; margin-bottom: 3px; }
  .modal-box .modal-desc { font-size: 11px; color: #6b7280; margin-bottom: 14px; }
  .modal-box label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 2px; }
  .modal-box input[type="date"], .modal-box input[type="number"] { width: 100%; padding: 5px 7px; border: 1px solid #e5e7eb; border-radius: 5px; margin-bottom: 8px; font-size: 13px; }
  .modal-box .city-edit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; margin-bottom: 10px; }
  .modal-box .city-edit-item { padding: 6px; background: #f9fafb; border-radius: 5px; font-size: 11px; }
  .modal-box .city-edit-item strong { font-size: 11px; display: block; margin-bottom: 3px; }
  .modal-box .city-edit-item .inline-inputs { display: flex; gap: 4px; align-items: center; }
  .modal-box .city-edit-item .inline-inputs input { width: 42px; padding: 2px 3px; border: 1px solid #e5e7eb; border-radius: 4px; font-size: 11px; margin-bottom: 0; text-align: center; }
  .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  @media (max-width: 1024px) { .summary-row { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 768px) {
    body { padding: 8px 10px; font-size: 12px; }
    .header-bar { padding: 8px 10px; gap: 6px; }
    .header-bar .hb-title { font-size: 14px; }
    .header-bar .hb-meta { font-size: 10px; display: none; }
    .header-bar .hb-qr img { width: 44px; height: 44px; }
    .header-bar .hb-qr .qr-label { font-size: 9px; max-width: 50px; }
    .pipeline-strip .ps-stage { padding: 6px 4px; }
    .pipeline-strip .ps-name { font-size: 10px; }
    .pipeline-strip .ps-stat { font-size: 11px; }
    .summary-row { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .summary-card { padding: 6px 10px; }
    .summary-card .sc-value { font-size: 17px; }
    .summary-card .sc-label { font-size: 10px; }
    .two-col { grid-template-columns: 1fr; gap: 8px; }
    .city-table { font-size: 11px; }
    .city-table th, .city-table td { padding: 4px 6px; }
    .modal-box { padding: 16px; }
  }
  @media (max-width: 480px) {
    body { padding: 6px; }
    .header-bar .hb-meta { display: none; }
    .header-bar .hb-title { font-size: 13px; }
    .header-bar .hb-date { font-size: 11px; }
    .header-bar .hb-qr .qr-label { display: none; }
    .header-bar .hb-qr img { width: 38px; height: 38px; }
    .btn { font-size: 11px; padding: 3px 8px; }
    .pipeline-strip { flex-wrap: wrap; }
    .pipeline-strip .ps-stage { flex: 1 0 33.33%; border-bottom: 1px solid var(--border); }
    .pipeline-strip .ps-stage:nth-child(n+4) { border-bottom: none; }
    .summary-row { grid-template-columns: 1fr 1fr; gap: 5px; }
    .summary-card .sc-value { font-size: 16px; }
    .summary-card .sc-icon { font-size: 16px; }
    .table-toolbar select, .table-toolbar input { max-width: 90px; font-size: 10px; }
    table { font-size: 10px; }
    table th, table td { padding: 4px 5px; }
    .badge { font-size: 9px; padding: 1px 4px; }
    .footer-dash { font-size: 9px; }
  }
</style>
</head>

</div>

<div class="pipeline-strip" id="pipeline"></div>
<div class="summary-row" id="summaryRow"></div>

    <textarea id="notesArea" placeholder="在此输入备注信息…"></textarea>
  </div>
  </div>
</div>

<div class="section-title"><span class="dot"></span>车辆明细 <span class="count-info" id="tableCount"></span></div>
<div class="table-wrap" id="detailSection">
  <div class="table-toolbar">
    <div class="filter-group">

      <input type="text" id="filterSearch" placeholder="搜车架号/车牌..." oninput="renderTable()">
    </div>
    <span class="count-info" id="filteredCount"></span>
  </div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>#</th><th>车架号</th><th>车牌</th><th>车型</th><th>车辆所在城市</th>
          <th>标签</th><th>交强险</th><th>商业险</th><th>年检</th><th>GPS</th><th>违章</th><th>状态</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="footer-dash">西十项目 · 第一批交付日报 &nbsp;|&nbsp; 数据源：西十选车表-定稿0730.xlsx &nbsp;|&nbsp; 生成：<span id="genTime"></span></div>

</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3>每日进度更新</h3>
    <p class="modal-desc">修改各城市完成数量，应用后看板即时刷新。</p>
    <label>数据日期</label>
    <input type="date" id="editDate">
    <label>各城市进度（上架 / 已交付）<span style="font-weight:400;color:var(--text-secondary)"> 可交付=自动计算</span></label>
    <div class="city-edit-grid" id="editCityGrid"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div><label>交强险已投保</label><input type="number" id="editJqx" min="0" max="204" value="138"></div>
      <div><label>商业险已投保</label><input type="number" id="editSyx" min="0" max="204" value="81"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="toggleEditMode()">取消</button>
      <input type="file" id="xlsxInput" accept=".xlsx,.xls" style="display:none" onchange="handleUpload(event)">
      <button class="btn" style="background:#eef2ff;color:#4f46e5" onclick="document.getElementById('xlsxInput').click()">📎 上传底表</button>
      <button class="btn btn-primary" onclick="applyEdits()">✅ 应用更新</button>
    </div>
  </div>
</div>

const BASELINE = {

};
const INS_OVERLAP = VEHICLES_RAW.filter(v => v.j !== '缺失' && v.s !== '缺失').length;
let state = {
  reportDate: BASELINE.reportDate,
  jqxDone: VEHICLES_RAW.filter(v => v.j !== '缺失').length,
  syxDone: VEHICLES_RAW.filter(v => v.s !== '缺失').length,
  overlapDone: INS_OVERLAP,
  cities: {}
};
for (let c in BASELINE.cities) state.cities[c] = { l: 0, f: 0 };
// Init from vehicle data
VEHICLES_RAW.forEach(v => {
  if(v.delivered && state.cities[v.c]) state.cities[v.c].f++;
  if(v.listed && state.cities[v.c]) state.cities[v.c].l++;
});
const DELIVERABLE_VINS = new Set(VEHICLES_RAW.filter(v=>v.can_deliver).map(v=>v.v));
let vehicles = VEHICLES_RAW.map(v => ({...v}));

function isDeliverable(v) { return DELIVERABLE_VINS.has(v.v); }
function getDeliverableByCity(city) { return vehicles.filter(v => v.c === city && isDeliverable(v)).length; }
function getDeliverableTotal() { return vehicles.filter(v => isDeliverable(v)).length; }
function getAgg() {
  let l=0, f=0;
  for (let c in state.cities) { l+=state.cities[c].l; f+=state.cities[c].f; }
  const d = getDeliverableTotal();
  return {l,d,f};
}
function pct(a,b) { return b>0 ? Math.round(a/b*100) : 0; }

function init() {
  document.getElementById('genTime').textContent = new Date().toLocaleString('zh-CN');
  document.getElementById('reportDate').textContent = state.reportDate;
  const saved=localStorage.getItem('xishi_note');
  if(saved) document.getElementById('notesArea').value=saved;
  document.getElementById('notesArea').addEventListener('input',function(){localStorage.setItem('xishi_note',this.value);});
  renderSummary(); renderPipeline(); renderCityContent(); renderAlertContent();
  populateFilters(); renderTable();
}

function renderSummary() {
  const {l,d,f}=getAgg();
  const T=BASELINE.total;
  const oP=pct(state.overlapDone, T);
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card">
      <div class="sc-icon">🚛</div><div class="sc-body"><div class="sc-value" style="color:var(--blue)">${T}<span style="font-size:13px;font-weight:400"> 台</span></div><div class="sc-label">${Object.keys(BASELINE.cities).length}城市 · ${new Set(VEHICLES_RAW.map(v=>v.m)).size}车型</div></div>
    </div>
    <div class="summary-card">
      <div class="sc-icon">🛡️</div><div class="sc-body"><div class="sc-value" style="color:${oP>=100?'var(--green)':(oP>=50?'var(--amber)':'var(--red)')}">${state.jqxDone}/${T}</div><div class="sc-label">交强险 · ${pct(state.jqxDone,T)}%</div></div>
    </div>
    <div class="summary-card">
      <div class="sc-icon">📦</div><div class="sc-body"><div class="sc-value" style="color:${f>0?'var(--green)':(d>0?'var(--blue)':'var(--text-secondary)')}">${f}/${d}</div><div class="sc-label">已交付/可交付 · ${pct(f,T)}% / ${pct(d,T)}%</div></div>
    </div>
    <div class="summary-card">
      <div class="sc-icon">⬆️</div><div class="sc-body"><div class="sc-value" style="color:${l>0?'#f97316':'var(--text-secondary)'}">${l}/${T}</div><div class="sc-label">车辆上架 · ${pct(l,T)}%</div></div>
    </div>`;
}

function renderPipeline() {
  const {l,d,f}=getAgg();
  const T=BASELINE.total;
  const stages = [
    {n:1, name:'客户确认', stat:`${T}台`, p:100, c:'#10b981', cls:'done'},
    {n:2, name:'车辆投保', stat:`交${state.jqxDone} 商${state.syxDone}`, p:pct(state.jqxDone,T), c:'#f59e0b', cls:state.jqxDone>=T?'done':'risk'},
    {n:3, name:'可交付车辆数', stat:`${d}/${T}`, p:pct(d,T), c:'#3b82f6', cls:d>=T?'done':'active'},
    {n:4, name:'交付完成', stat:`${f}/${T}`, p:pct(f,T), c:'#8b5cf6', cls:f>=T?'done':'stage4'},
    {n:5, name:'车辆上架', stat:`${l}/${T}`, p:pct(l,T), c:'#f97316', cls:l>=T?'done':'stage5'}
  ];
  document.getElementById('pipeline').innerHTML = stages.map(s => `
    <div class="ps-stage ${s.cls}"><div class="ps-num" style="background:${s.p>0?s.c:'#e5e7eb'};color:${s.p>0?'#fff':'var(--text-secondary)'}">${s.n}</div><div class="ps-name">${s.name}</div><div class="ps-stat" style="color:${s.p>0?s.c:'var(--text-secondary)'}">${s.stat}</div><div class="ps-bar"><div class="ps-bar-fill" style="width:${s.p}%;background:${s.p>=100?'#10b981':s.p>0?s.c:'#e5e7eb'}"></div></div></div>
  `).join('');
}

function renderCityContent() {
  const order = Object.keys(BASELINE.cities).sort((a,b)=>BASELINE.cities[b]-BASELINE.cities[a]);
  const {l:tl,d:td,f:tf}=getAgg();
  const rows=order.map(city=>{
    const c=state.cities[city]; if(!c) return '';
    const t=BASELINE.cities[city], cd=getDeliverableByCity(city);
    const fP=pct(c.f,t);
    return `<tr><td class="ct-name">${city}</td><td><strong>${t}</strong></td><td>${cd}<span style="color:var(--text-secondary);font-size:10px">/${t}</span></td><td>${c.f}<span style="color:var(--text-secondary);font-size:10px">/${t}</span></td><td><div class="ct-mini-bar"><div class="ct-seg" style="width:${fP}%;background:${cd===c.f?'var(--green)':'var(--amber)'}"></div><div class="ct-seg" style="width:${100-fP}%;background:#e5e7eb"></div></div><span style="font-size:10px;color:var(--text-secondary)">${fP}%</span></td><td>${c.l}<span style="color:var(--text-secondary);font-size:10px">/${t}</span></td></tr>`;
  }).join('');
  document.getElementById('cityContent').innerHTML = `
    <table class="city-table"><thead><tr><th>城市</th><th>总量</th><th>可交付</th><th>已交付</th><th>交付进度</th><th>车辆上架</th></tr></thead>
      <tbody>${rows}<tr style="background:var(--gray-light);font-weight:600;"><td class="ct-name">合计</td><td><strong>${BASELINE.total}</strong></td><td>${td}</td><td>${tf}</td><td><div class="ct-mini-bar"><div class="ct-seg" style="width:${pct(tf,BASELINE.total)}%;background:${td===tf?'var(--green)':'var(--amber)'}"></div><div class="ct-seg" style="width:${100-pct(tf,BASELINE.total)}%;background:#e5e7eb"></div></div><span style="font-size:10px;color:var(--text-secondary);margin-left:4px">${pct(tf,BASELINE.total)}%</span></td><td>${tl}</td></tr></tbody></table>`;
}

  const syxM=VEHICLES_RAW.filter(v=>v.s==='缺失').length;
  const gpsA=VEHICLES_RAW.filter(v=>v.gps!=='正常').length;

  const njSoon=VEHICLES_RAW.filter(v=>v.nj_days>=0&&v.nj_days<=45).length;

    <div class="alert-item" style="border-left-color:#3b82f6;">
      <div class="ai-title">🚔 违章记录：${wzV}台有违章（${wzN}台无违章）</div>

      <div class="ai-title">✅ 年检：${njNormal}台正常</div>

function renderTable() {
  const fCity=document.getElementById('filterCity').value;
  const fModel=document.getElementById('filterModel').value;
  const fIns=document.getElementById('filterIns').value;
  const fSearch=document.getElementById('filterSearch').value.toUpperCase();
  let filtered=vehicles.filter(v=>{
    if(fCity&&v.c!==fCity)return false;
    if(fModel&&v.m!==fModel)return false;
    if(fIns==='both'&&(v.j==='缺失'||v.s==='缺失'))return false;
    if(fIns==='jqx_only'&&v.j==='缺失')return false;
    if(fIns==='syx_only'&&v.s==='缺失')return false;
    if(fIns==='none'&&(v.j!=='缺失'||v.s!=='缺失'))return false;
    if(fSearch&&!v.v.toUpperCase().includes(fSearch)&&!v.p.toUpperCase().includes(fSearch))return false;
    return true;
  });
  document.getElementById('filteredCount').textContent=`共 ${filtered.length} 台`;
  document.getElementById('tableCount').textContent=`(${BASELINE.total}台)`;
  const rows=filtered.map(v=>{
    let njClass='',njBg='';
    if(v.nj_days>45){njClass='badge-green';njBg='#ecfdf5';}
    else if(v.nj_days>=0){njClass='badge-amber';njBg='#fffbeb';}
    else if(v.nj!==''){njClass='badge-red';njBg='#fef2f2';}
    const jqxStyle=v.j==='缺失'?' style="color:var(--red);font-size:11px"':'';
    const syxStyle=v.s==='缺失'?' style="color:var(--red);font-size:11px"':'';
    return `<tr><td>${v.idx}</td><td style="font-family:monospace;font-size:11px">${v.v}</td><td>${v.p||'-'}</td><td>${v.m}</td><td>${v.c}</td><td${jqxStyle}>${v.j}</td><td${syxStyle}>${v.s}</td><td style="background:${njBg}"><span class="${njClass}">${v.nj||'-'}</span></td><td>${v.wz||'-'}</td><td>${v.gps}</td></tr>`;
  }).join('');
  document.getElementById('detailBody').innerHTML=rows||'<tr><td colspan="10" style="padding:20px;color:var(--text-secondary)">无匹配车辆</td></tr>';
}

function populateFilters() {
  const cities=[...new Set(VEHICLES_RAW.map(v=>v.c))].sort();
  const models=[...new Set(VEHICLES_RAW.map(v=>v.m))].sort();
  const fill=(id,items)=>{
    const s=document.getElementById(id);if(!s)return;
    items.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});
  };
  fill('filterCity',cities);fill('filterModel',models);
}

function toggleEditMode(){
  const m=document.getElementById('editModal'),b=document.getElementById('editBtn');
  if(!m.classList.contains('show')){
    document.getElementById('editDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('editJqx').value=state.jqxDone;
    document.getElementById('editSyx').value=state.syxDone;
    const order=Object.keys(BASELINE.cities).sort((a,b)=>BASELINE.cities[b]-BASELINE.cities[a]);
    // Generate city edit grid
    let gridHTML='';
    order.forEach(city=>{
      gridHTML+=`<div style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--gray-light);margin-bottom:4px">
<div style="font-weight:600;font-size:12px;margin-bottom:4px">${city} <span style="font-weight:400;color:var(--text-secondary)">${BASELINE.cities[city]}台</span></div>
<div style="display:flex;gap:8px"><label style="font-size:11px">上架</label><input type="number" id="el_${city}" min="0" value="${state.cities[city].l}" style="width:56px;padding:2px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;text-align:center">
<label style="font-size:11px">已交付</label><input type="number" id="ef_${city}" min="0" value="${state.cities[city].f}" style="width:56px;padding:2px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;text-align:center"></div></div>`;
    });
    document.getElementById('editCityGrid').innerHTML=gridHTML;
    m.classList.add('show');b.textContent='关闭编辑';
  }else{ m.classList.remove('show');b.textContent='✏️ 更新进度'; }
}

function applyEdits(){
  state.reportDate=document.getElementById('editDate').value||state.reportDate;
  state.jqxDone=parseInt(document.getElementById('editJqx').value)||0;
  state.syxDone=parseInt(document.getElementById('editSyx').value)||0;
  state.overlapDone=VEHICLES_RAW.filter(v=>v.j!=='缺失'&&v.s!=='缺失').length;
  const order=Object.keys(BASELINE.cities).sort((a,b)=>BASELINE.cities[b]-BASELINE.cities[a]);
  order.forEach(city=>{
    const lE=document.getElementById('el_'+city), fE=document.getElementById('ef_'+city);
    if(lE) state.cities[city].l=parseInt(lE.value)||0;
    if(fE) state.cities[city].f=parseInt(fE.value)||0;
  });
  document.getElementById('reportDate').textContent=state.reportDate;
  saveProgress();
  renderSummary(); renderPipeline(); renderCityContent(); renderAlertContent();
  toggleEditMode();
}

function saveProgress(){const d={date:state.reportDate,jqx:state.jqxDone,syx:state.syxDone,cities:{},vins:[...DELIVERABLE_VINS]};for(let c in state.cities)d.cities[c]={l:state.cities[c].l,f:state.cities[c].f};localStorage.setItem('xishi_progress',JSON.stringify(d));}
function loadProgress(){try{const r=localStorage.getItem('xishi_progress');if(r){const d=JSON.parse(r);if(d.date)state.reportDate=d.date;if(d.vins){DELIVERABLE_VINS.clear();d.vins.forEach(v=>DELIVERABLE_VINS.add(v));}if(d.cities)for(let c in d.cities)if(state.cities[c]){state.cities[c].l=d.cities[c].l;state.cities[c].f=d.cities[c].f;}}}catch(e){}}
loadProgress();

function exportSnapshot(){
  const btn=document.querySelector('.btn-primary');
  btn.textContent='⏳ 生成中...'; btn.disabled=true;
  const detail=document.getElementById('detailSection');
  const titleEl=detail.previousElementSibling;
  const container=document.querySelector('.container');
  const twoCol=document.querySelector('.two-col');
  const rightCol=document.querySelector('.right-col');
  const alertBox=document.getElementById('alertBox');
  const notesBox=document.getElementById('notesBox');
  const cityBox=document.getElementById('cityBox');
  const alertContent=document.getElementById('alertContent');
  const notesArea=document.getElementById('notesArea');
  const notesText=notesArea.value;
  const notesDiv=document.createElement('div');
  notesDiv.id='notesExportDiv';
  notesDiv.style.cssText='width:100%;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text);background:var(--card-bg);line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;';
  notesDiv.textContent=notesText;
  notesArea.style.display='none';
  notesArea.parentNode.insertBefore(notesDiv, notesArea);
  const orig = {
    cW: container.style.width, cMW: container.style.maxWidth,
    tcD: twoCol.style.display, rCD: rightCol?rightCol.style.display:'',
    rCF: rightCol?rightCol.style.flex:'', rCFD: rightCol?rightCol.style.flexDirection:'',
    aOF: alertBox.style.flex, nOF: notesBox.style.flex,
    acO: alertContent.style.overflow, acOY: alertContent.style.overflowY, acH: alertContent.style.maxHeight
  };
  container.style.width='750px'; container.style.maxWidth='none';
  twoCol.style.display='block';
  if(rightCol){ rightCol.style.display='block'; rightCol.style.flex='none'; rightCol.style.flexDirection='column'; }
  cityBox.style.marginBottom='10px';
  alertBox.style.flex='none'; alertBox.style.marginBottom='10px';
  notesBox.style.flex='none';
  notesArea.style.height=notesArea.scrollHeight+'px'; notesArea.style.overflow='visible';
  alertContent.style.overflow='visible'; alertContent.style.overflowY='visible'; alertContent.style.maxHeight='none';
  detail.style.display='none';
  if(titleEl) titleEl.style.display='none';

  html2canvas(container, { scale: 2, backgroundColor: '#f5f6f8', useCORS: true, width:750 }).then(canvas => {
    container.style.width=orig.cW; container.style.maxWidth=orig.cMW;
    twoCol.style.display=orig.tcD;
    if(rightCol){ rightCol.style.display=orig.rCD; rightCol.style.flex=orig.rCF; rightCol.style.flexDirection=orig.rCFD; }
    cityBox.style.marginBottom='';
    alertBox.style.flex=orig.aOF; alertBox.style.marginBottom='';
    notesBox.style.flex=orig.nOF;
    alertContent.style.overflow=orig.acO; alertContent.style.overflowY=orig.acOY; alertContent.style.maxHeight=orig.acH;
    notesDiv.remove(); notesArea.style.display='';
    detail.style.display=''; if(titleEl) titleEl.style.display='';
    btn.textContent='📥 导出'; btn.disabled=false;
    const link=document.createElement('a');
    link.download=`西十日报快照_${state.reportDate}.jpg`;
    link.href=canvas.toDataURL('image/jpeg', 0.9);
    link.click();
  }).catch(() => {
    container.style.width=orig.cW; container.style.maxWidth=orig.cMW;
    twoCol.style.display=orig.tcD;
    if(rightCol){ rightCol.style.display=orig.rCD; rightCol.style.flex=orig.rCF; rightCol.style.flexDirection=orig.rCFD; }
    cityBox.style.marginBottom='';
    alertBox.style.flex=orig.aOF; alertBox.style.marginBottom='';
    notesBox.style.flex=orig.nOF;
    alertContent.style.overflow=orig.acO; alertContent.style.overflowY=orig.acOY; alertContent.style.maxHeight=orig.acH;
    notesDiv.remove(); notesArea.style.display='';
    detail.style.display=''; if(titleEl) titleEl.style.display='';
    btn.textContent='📥 导出'; btn.disabled=false;
    alert('导出失败，请重试');
  });
}

function handleUpload(e){
  const f=e.target.files[0];if(!f)return;
  const btn=document.querySelector('#editModal .btn-primary');
  btn.textContent='⏳ 解析中...';btn.disabled=true;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const sh=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sh,{header:1});
      DELIVERABLE_VINS.clear();
      const cs={};for(let c in BASELINE.cities)cs[c]={l:0,f:0};
      for(let i=1;i<rows.length;i++){
        const row=rows[i];if(!row[2])continue;
        const vin=String(row[2]||'').trim(),city=String(row[4]||'').trim();
        if(Number(row[12])>40000||row[12])DELIVERABLE_VINS.add(vin);
        if(cs[city]){
          if(Number(row[13])>40000||row[13])cs[city].f++;
          if(Number(row[14])>40000||row[14])cs[city].l++;
        }
      }
      for(let c in cs)if(state.cities[c]){state.cities[c].l=cs[c].l;state.cities[c].f=cs[c].f;}
      saveProgress();
      renderSummary();renderPipeline();renderCityContent();renderAlertContent();
      const order=Object.keys(BASELINE.cities).sort((a,b)=>BASELINE.cities[b]-BASELINE.cities[a]);
      order.forEach(city=>{
        const lE=document.getElementById('el_'+city),fE=document.getElementById('ef_'+city);
        if(lE)lE.value=state.cities[city].l;
        if(fE)fE.value=state.cities[city].f;
      });
      btn.textContent='✅ 应用更新';btn.disabled=false;e.target.value='';
    }catch(err){alert('解析失败');btn.textContent='✅ 应用更新';btn.disabled=false;}
  };
  r.readAsArrayBuffer(f);
}

init();

</script>
